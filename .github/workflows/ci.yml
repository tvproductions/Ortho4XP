name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-format \
            clang-tidy \
            cmake \
            curl \
            g++ \
            lld \
            libcurl4-openssl-dev \
            libexpat1-dev \
            libgeos-dev \
            libjpeg-dev \
            libjson-c-dev \
            liblerc-dev \
            liblzma-dev \
            libpng-dev \
            libproj-dev \
            libspatialindex-dev \
            libsqlite3-dev \
            libtiff-dev \
            libwebp-dev \
            libzstd-dev \
            ninja-build \
            python3-tk \
            zlib1g-dev

      - name: Build matching native GDAL
        run: |
          bash scripts/install_linux_gdal.sh "$RUNNER_TEMP/ortho4xp-gdal"
          echo "$RUNNER_TEMP/ortho4xp-gdal/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ortho4xp-gdal/lib" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Verify skills stack sources
        run: uv run python scripts/check_skills_stack.py

      - name: Python syntax smoke test
        run: uv run python -m compileall -q Ortho4XP.py src

      - name: Python distribution build
        run: uv build

      - name: Python import smoke test
        run: uv run python -c "import os, sys; sys.path.append(os.path.abspath('src')); import O4_File_Names, O4_Geo_Utils, O4_Imagery_Utils; print('Core imports succeeded.')"

      - name: CLI startup smoke test
        run: uv run python Ortho4XP.py --help

      - name: Headless build job validation smoke test
        run: uv run python Ortho4XP.py validate-job tests/fixtures/build_job_minimal.toml

      - name: Unit tests
        run: uv run python -m unittest discover -s tests

      - name: Ruff lint
        run: uv run ruff check --output-format=github Ortho4XP.py src scripts

      - name: Ruff format
        run: uv run python .codex/skills/quality-check/scripts/quality_check.py --format-only

      - name: Type check
        run: uv run ty check tests scripts src/O4_Geo_Utils.py src/O4_File_Names.py

      - name: Build Triangle4XP with LLVM
        run: |
          clang-tidy --verify-config
          cmake --preset llvm-release -S Utils
          cmake --build Utils/build/llvm-release --target Triangle4XP
          test -x Utils/build/llvm-release/Triangle4XP

  # GitHub's Windows 11 hosted runner is arm64. Use the standard x64 runner
  # because this repo currently ships win_amd64 dependency wheels.
  windows:
    name: Windows x64
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"

      - name: Install system dependencies
        run: choco install llvm ninja cmake --no-progress --yes

      - name: Add LLVM to PATH
        run: echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Verify skills stack sources
        run: uv run python scripts/check_skills_stack.py

      - name: Python syntax smoke test
        run: uv run python -m compileall -q Ortho4XP.py src

      - name: Python distribution build
        run: uv build

      - name: Python import smoke test
        run: uv run python -c "import os, sys; sys.path.append(os.path.abspath('src')); import O4_File_Names, O4_Geo_Utils, O4_Imagery_Utils; print('Core imports succeeded.')"

      - name: CLI startup smoke test
        run: uv run python Ortho4XP.py --help

      - name: Headless build job validation smoke test
        run: uv run python Ortho4XP.py validate-job tests/fixtures/build_job_minimal.toml

      - name: Unit tests
        run: uv run python -m unittest discover -s tests

      - name: Ruff lint
        run: uv run ruff check --output-format=github Ortho4XP.py src scripts

      - name: Ruff format
        run: uv run python .codex/skills/quality-check/scripts/quality_check.py --format-only

      - name: Type check
        run: uv run ty check tests scripts src/O4_Geo_Utils.py src/O4_File_Names.py

      - name: Build Triangle4XP with LLVM
        run: |
          clang-tidy --verify-config
          cmake --preset llvm-release -S Utils
          cmake --build Utils/build/llvm-release --target Triangle4XP
          if (-not (Test-Path Utils/build/llvm-release/Triangle4XP.exe)) {
            throw "Triangle4XP.exe was not built."
          }

  macos:
    name: macOS
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"

      - name: Install system dependencies
        run: |
          brew install gdal llvm ninja spatialindex
          test "$(gdal-config --version)" = "3.13.3"

      - name: Add LLVM to PATH
        run: echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Verify skills stack sources
        run: uv run python scripts/check_skills_stack.py

      - name: Python syntax smoke test
        run: uv run python -m compileall -q Ortho4XP.py src

      - name: Python distribution build
        run: uv build

      - name: Python import smoke test
        run: uv run python -c "import os, sys; sys.path.append(os.path.abspath('src')); import O4_File_Names, O4_Geo_Utils, O4_Imagery_Utils; print('Core imports succeeded.')"

      - name: CLI startup smoke test
        run: uv run python Ortho4XP.py --help

      - name: Headless build job validation smoke test
        run: uv run python Ortho4XP.py validate-job tests/fixtures/build_job_minimal.toml

      - name: Unit tests
        run: uv run python -m unittest discover -s tests

      - name: Ruff lint
        run: uv run ruff check --output-format=github Ortho4XP.py src scripts

      - name: Ruff format
        run: uv run python .codex/skills/quality-check/scripts/quality_check.py --format-only

      - name: Type check
        run: uv run ty check tests scripts src/O4_Geo_Utils.py src/O4_File_Names.py

      - name: Build Triangle4XP with LLVM
        run: |
          clang-tidy --verify-config
          cmake --preset llvm-release -S Utils
          cmake --build Utils/build/llvm-release --target Triangle4XP
          test -x Utils/build/llvm-release/Triangle4XP
